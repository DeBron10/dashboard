body {

.chart-row {

    gap: 20px;

.chart-box {
    width: 33.33%;
    height: 550px;
    background-color: #FFFFFF;

    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

.place-chart-box {

.category-chart-box {

.cost-chart-box {

.cost-data-table {

    right: 15px;
    bottom: 15px;

    border: 1px solid #D1D5DB;
    border-radius: 8px;

.cost-data-table table {

.cost-data-table td {

    border-radius: 5px;

    margin-bottom: 10px;

@media (max-width: 1200px) {

    .chart-row {
        flex-direction: column;
    }

    .chart-box {
        width: 100%;

        function exportToExcel() {

    // Get the currently displayed Highcharts chart
    var chart = Highcharts.charts[0];

    var excelData = [];

    // Get all points from the pie chart
    for (var i = 0; i < chart.series[0].points.length; i++) {

        var point = chart.series[0].points[i];

        // Export only visible places
        if (point.visible) {

            excelData.push({
                "Place": point.name,
                "Project Count": point.y,
                "Percentage": point.percentage.toFixed(1) + "%"
            });
        }
    }

    // Convert data to Excel worksheet
    var worksheet = XLSX.utils.json_to_sheet(excelData);

    // Create workbook
    var workbook = XLSX.utils.book_new();

    // Add worksheet
    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Projects"
    );

    // Download Excel file
    XLSX.writeFile(
        workbook,
        "Projects_By_Place.xlsx"
    );
}


function exportCategoryToExcel() {

function exportCostToExcel() {

function showCostDataTable(chart) {

    var container =
        document.getElementById('costContainer');

    // Remove existing table if already present
    var oldTable =
        container.querySelector('.cost-data-table');

    if (oldTable) {
        oldTable.remove();
    }

    // Create table container
    var tableContainer =
        document.createElement('div');

    tableContainer.className =
        'cost-data-table';

    // Create close button
    var closeButton =
        document.createElement('button');

    closeButton.className =
        'close-data-table';

    closeButton.innerHTML =
        'Close';

    closeButton.onclick = function () {

        tableContainer.remove();
    };

    tableContainer.appendChild(closeButton);

    // Create table
    var table =
        document.createElement('table');

    // Create table header
    var headerRow =
        document.createElement('tr');

    var placeHeader =
        document.createElement('th');

    placeHeader.innerHTML =
        'Place';

    var costHeader =
        document.createElement('th');

    costHeader.innerHTML =
        'Cost';

    var percentageHeader =
        document.createElement('th');

    percentageHeader.innerHTML =
        'Percentage';

    headerRow.appendChild(placeHeader);
    headerRow.appendChild(costHeader);
    headerRow.appendChild(percentageHeader);

    table.appendChild(headerRow);

    // Add visible points
    for (
        var i = 0;
        i < chart.series[0].points.length;
        i++
    ) {

        var point =
            chart.series[0].points[i];

        if (point.visible) {

            var row =
                document.createElement('tr');

            var placeCell =
                document.createElement('td');

            placeCell.innerHTML =
                point.name;

            var costCell =
                document.createElement('td');

            costCell.innerHTML =
                point.y.toFixed(1);

            var percentageCell =
                document.createElement('td');

            percentageCell.innerHTML =
                point.percentage.toFixed(1) + '%';

            row.appendChild(placeCell);
            row.appendChild(costCell);
            row.appendChild(percentageCell);

            table.appendChild(row);
        }
    }

    tableContainer.appendChild(table);

    // Make sure chart container can contain overlay
    container.style.position = 'relative';

    container.appendChild(tableContainer);
}
