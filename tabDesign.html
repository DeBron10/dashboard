<!DOCTYPE html>
<html>

<head>

<title>Animated Green Tabs</title>


<style>


body{

    font-family:Arial, sans-serif;
    background:#f5f5f5;

}



.container{

    width:95%;
    margin:50px auto;

    background:white;

    padding:20px;

    border-radius:10px;

}



/* TAB BAR */

.tabs{

    display:flex;

    width:100%;

    border-bottom:1px solid #ddd;

    position:relative;

}



/* TAB BUTTON */

.tab-btn{

    flex:1;

    padding:15px 5px;

    border:none;

    background:none;

    cursor:pointer;

    font-size:15px;

    color:#555;

    position:relative;

}



/* ACTIVE TEXT */

.tab-btn.active{

    color:#16a34a;

    font-weight:bold;

}



/* ACTIVE UNDERLINE */

.tab-btn.active::after{

    content:"";

    position:absolute;

    bottom:-1px;

    left:20%;

    width:60%;

    height:3px;

    background:#16a34a;

    border-radius:10px;

}



/* HOVER ANIMATION LINE */

.tab-btn::before{

    content:"";

    position:absolute;

    bottom:-1px;

    left:20%;

    width:60%;

    height:3px;

    background:#bbf7d0;

    transform:scaleX(0);

    transition:0.3s;

    border-radius:10px;

}



.tab-btn:hover::before{

    transform:scaleX(1);

}



.tab-btn:hover{

    color:#16a34a;

}



/* CONTENT */


.tab-content{

    display:none;

    padding:30px;

    margin-top:20px;

    background:#f0fdf4;

    border-radius:8px;

    font-size:20px;

}



.tab-content.active{

    display:block;

}



</style>


</head>


<body>



<div class="container">



<h2>Project Dashboard</h2>



<div class="tabs">


<button class="tab-btn active" onclick="openTab(event,'tab1')">
Project Details
</button>

subprojects given to other labs
</button>

</button>

user reviews
</button>


<button class="tab-btn" onclick="openTab(event,'tab5')">
project team
</button>


<button class="tab-btn" onclick="openTab(event,'tab6')">
pdc extension
</button>


<button class="tab-btn" onclick="openTab(event,'tab7')">
cost enhancement
</button>


<button class="tab-btn" onclick="openTab(event,'tab8')">
tot
</button>


<button class="tab-btn" onclick="openTab(event,'tab9')">
patent
</button>


<button class="tab-btn" onclick="openTab(event,'tab10')">
Budget
</button>


<button class="tab-btn" onclick="openTab(event,'tab11')">
Users
</button>


<button class="tab-btn" onclick="openTab(event,'tab12')">
Settings
</button>


<button class="tab-btn" onclick="openTab(event,'tab13')">
Logs
</button>


<button class="tab-btn" onclick="openTab(event,'tab14')">

</button>


<button class="tab-btn" onclick="openTab(event,'tab15')">

</button>


</div>



<div id="tab1" class="tab-content active">

</div>


<div id="tab2" class="tab-content">

</div>


<div id="tab3" class="tab-content">

</div>


<div id="tab4" class="tab-content">

</div>


<div id="tab5" class="tab-content">

</div>


<div id="tab6" class="tab-content">
Team Content
</div>


<div id="tab7" class="tab-content">
Tasks Content
</div>


<div id="tab8" class="tab-content">
Status Content
</div>


<div id="tab9" class="tab-content">
Timeline Content
</div>


<div id="tab10" class="tab-content">

</div>


<div id="tab11" class="tab-content">

</div>


<div id="tab12" class="tab-content">

</div>


<div id="tab13" class="tab-content">

</div>


<div id="tab14" class="tab-content">
Alerts Content
</div>


<div id="tab15" class="tab-content">
Help Content
</div>



</div>




<script>


function openTab(event, tabName){


    let contents =
    document.getElementsByClassName("tab-content");


    let buttons =
    document.getElementsByClassName("tab-btn");



    for(let i=0;i<contents.length;i++){

        contents[i].classList.remove("active");

    }



    for(let i=0;i<buttons.length;i++){

        buttons[i].classList.remove("active");

    }



    document.getElementById(tabName)
    .classList.add("active");



    event.currentTarget
    .classList.add("active");


}



</script>


</body>

</html>
